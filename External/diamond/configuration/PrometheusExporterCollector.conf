################################################################################
# Diamond PrometheusExporterCollector Configuration
################################################################################

# Enable the collector
enabled = True

# Comma-separated list of exporter names (must match section names below)
exporters = 192_168_0_103

# Collection interval in seconds
interval = 60

# HTTP request timeout in seconds
timeout = 10

# Metric path prefix in Diamond
path = thermostato


################################################################################
# Exporter-specific configurations
# Format:
# [<EXPORTER_NAME>]
# exporter_url = https://host:port/metrics
# <metric_name_from_prometheus> = <diamond_metric_name>
################################################################################

[192_168_0_103]
# URL to the Prometheus exporter metrics endpoint
exporter_url = http://192.168.0.103/metrics

# Metric mappings: prometheus_metric_name = diamond_metric_name
# You can map metrics with labels by including the full metric name with labels
thermostato_temperature_celsius = temperature
# thermostato_temperature_delta = delta
thermostato_temperature_setpoint = setpoint
# thermostato_heating_mode
thermostato_pump_status = pump
thermostato_heating_time_seconds = heating_time
thermostato_rest_time_seconds = rest_time
thermostato_last_heating_time_seconds = last_heating_time
thermostato_free_heap = free_heap
thermostato_heap_fragmentation = heap_fragmentation
thermostato_heap_max_block_size = heap_max_block_size
thermostato_uptime_ms = uptime_ms
# thermostato_reset_reason
